*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f4ef;color:#333}
header{background:#047857;color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:20px;margin:0}
.tabs{margin-left:auto;display:flex;gap:4px;background:#065f46;padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;color:#d1fae5;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
.tabs button.active{background:#fff;color:#065f46}
main{max-width:860px;margin:0 auto;padding:14px 14px 80px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 8px}
h3{font-size:15px;margin:0 0 8px}
p.hint{font-size:13px;color:#666;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
input,select,textarea{border:1px solid #ccc;border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit}
input.flex,textarea{flex:1;min-width:140px}
.btn{background:#059669;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:500;cursor:pointer}
.btn.soft{background:#ecfdf5;color:#065f46}
.btn.ghost{background:#fff;color:#444;border:1px solid #ccc}
.btn:disabled{opacity:.5}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500}
.chip.green{background:#d1fae5;color:#065f46}.chip.amber{background:#fef3c7;color:#92400e}.chip.gray{background:#f3f4f6;color:#4b5563}.chip.pink{background:#fce7f3;color:#9d174d}.chip.red{background:#fee2e2;color:#b91c1c}
ul{list-style:none;margin:0;padding:0}
li.line{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f1f1f1;flex-wrap:wrap}
li.line:last-child{border-bottom:0}
.muted{font-size:12px;color:#888}
.done{text-decoration:line-through;color:#aaa}
.stars{color:#f59e0b;letter-spacing:1px;cursor:pointer}
.stars .off{color:#d1d5db}
.recipe{border:1px solid #e5e5e5;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px}
.recipe.chosen{border-color:#059669;background:#ecfdf5}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:#666}
.rtop{display:flex;justify-content:space-between;gap:6px}
.x{background:none;border:0;color:#ccc;cursor:pointer;font-size:15px}
.x:hover{color:#ef4444}
.notechip{font-size:12px;font-style:italic;background:#f9fafb;color:#4b5563;border-radius:6px;padding:3px 8px}
form.add{background:#f9fafb;border:1px solid #e5e5e5;border-radius:12px;padding:12px;margin-bottom:12px}
.warn{background:#fffbeb;color:#92400e;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}
</style>
</head>

function persist(noStamp){
 ["tab","menu","stock","store","extra","checked","removed","ratings","excluded","custom","nextRid","sync","savedAt"].forEach(function(k){save(k,S[k])});
 if(!noStamp)S.savedAt=Date.now();
 if(!noStamp)schedulePush();
}

function allRecipes(){

 S.custom.concat(RECIPE_BUILTIN).forEach(function(r){
   if(seen[r.rid||r.name])return; seen[r.rid||r.name]=1;
   out.push(r);
 });
 return out;
}

function normCat(cat,name){
 if(cat==="Droogvoer & Pasta"||cat==="Droogfoer & Pasta"){
  var s=slug(name||"");
  if(/(noedel|noodle|mihoen|ramen)/.test(s))return "Aziatisch";
  if(/(pasta|penne|fusilli|lasagna|spaghetti|macaroni|tagliatelle|tortellini)/.test(s))return "Pasta";

 }
 return cat;
}

function scaleQty(q,port){
 var m=q.match(/^([\d.,]+)\s*(.*)$/);if(!m)return q;
 var f=(port||2)/2;if(f===1)return q;
 var n=parseFloat(m[1].replace(",",".")),v=n*f;
 v=Math.round(v*2)/2;
 var vs=(v%1===0)?String(Math.round(v)):String(v).replace(".",",");
 return vs+(m[2]?" "+m[2]:"");
}
function qtyLabel(item,port,cust){var q=(cust||"").trim()||QTY[slug(item)];return q?scaleQty(q,port):""}

 });
}

var UNITS=new Set(["g","gr","gram","kg","mg","ml","dl","cl","l","el","tl","eetlepel","theelepel","st","stuk","stuks","bos","bosje","blik","blikken","pot","potje","potjes","pak","pakje","pakjes","snufje","handvol","teen","tenen","plakje","plakjes","sneetje","sneetjes","bakje","bakjes","schaaltje","doosje","beetje","flinke","verse","vers","kleine","grote","groot","middelgrote","een","één"]);
function guessCat(name){

 if(/(tofu|tempeh|seitan|falafel|vleesvervanger|burger|worstje|gehakt|spek|braadworst)/.test(s))return "Vleesvervangers & Koelvers";

function parsePaste(text){
 var out=[],seen={};
 var FRAC=["\u00bd","\u00bc","\u00be","\u2153","\u2154"];
 function isQty(t){return /^\d+([.,]\d+)?([\/\-]\d+)?$/.test(t)||/^\d/.test(t)||/^0?[.,]\d+$/.test(t)||FRAC.indexOf(t)>=0}
 function isUnit(t){return UNITS.has(t.toLowerCase().replace(/[.,]$/,""))}
 function qtyOnlyLine(l){
   var w=l.split(/\s+/);
   return w.length>0&&w.every(function(t){return isQty(t)||isUnit(t)});
 }
 String(text||"").split(/\r?\n/).forEach(function(raw){
   var l=raw.replace(/^[\s*\-•\u2022\d.)]+/,"").trim();
   if(l.length<2||/^(ingredi|bereiding:|recept:)/i.test(l))return;
   if(qtyOnlyLine(l))return;
   var w=l.split(/\s+/),i=0;
   while(i<w.length&&(isQty(w[i].toLowerCase().replace(/[.,]$/,""))||isUnit(w[i]))){i++}
   var nm=w.slice(i).join(" ").trim()||l;
   if(!nm||qtyOnlyLine(nm))return;
   var key=slug(nm);
   if(seen[key])return;seen[key]=1;
   var c=guessCat(nm);
   if(!c)return; // bijv. water
   out.push({item:nm.charAt(0).toUpperCase()+nm.slice(1),cat:c});
 });
 return out;
}

var SYNC_STATUS="";
function setSyncStatus(t){SYNC_STATUS=t;S.lastSyncStatus=t;var e=document.getElementById("syncStatus");if(e)e.textContent=t}
function syncOk(msg){S.lastSync=Date.now();setSyncStatus(msg);save("lastSync",S.lastSync);save("lastSyncStatus",S.lastSyncStatus)}
function fmtSync(t){var d=new Date(t);return d.toLocaleDateString("nl-NL")+" "+d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})}
function syncPayload(){return {app:"weekmenu-sync-v1",t:Date.now(),menu:S.menu,stock:S.stock,store:S.store,extra:S.extra,checked:S.checked,removed:S.removed,ratings:S.ratings,excluded:S.excluded,custom:S.custom,nextRid:S.nextRid,gistId:(S.sync&&S.sync.gistId)||""}}
function applyPayload(p){
 if(!p||!p.menu)return false;
 S.menu=p.menu;S.stock=p.stock||[];S.store=p.store||STORES[0];S.extra=p.extra||[];
 S.checked=p.checked||{};S.removed=p.removed||[];S.ratings=p.ratings||{};S.excluded=p.excluded||[];
 S.custom=p.custom||[];S.nextRid=p.nextRid||1000;
 if(p.gistId&&S.sync&&!S.sync.gistId)S.sync.gistId=p.gistId;
 persist(true);return true;
}
function ghHeaders(){return {Authorization:"Bearer "+S.sync.token,Accept:"application/vnd.github+json","Content-Type":"application/json"}}
function gh(method,url,body){
 return fetch(url,{method:method,headers:ghHeaders(),body:body?JSON.stringify(body):undefined})
  .then(function(r){if(!r.ok)throw new Error("GitHub "+r.status);return r.json()});
}
function findSyncGist(){
 return gh("GET","https://api.github.com/gists?per_page=100")
  .then(function(list){return (list||[]).filter(function(g){return g.description==="weekmenu-sync"&&g.files&&g.files["weekmenu.json"]})[0]||null});
}
function resolveGist(){return gh("GET","https://api.github.com/gists?per_page=100").then(function(list){
 var gs=(list||[]).filter(function(g){return g.description==="weekmenu-sync"&&g.files&&g.files["weekmenu.json"]});
 if(!gs.length)return null;
 gs.sort(function(a,b){return String(b.updated_at||"").localeCompare(String(a.updated_at||""))});
 return gs[0];
 })}
function countMsg(){return "weekmenu: "+S.menu.length+" recepten, "+(S.stock.length+S.extra.length)+" extra\u00b7items op lijst"}
function pushNow(){
 if(!S.sync||!S.sync.token)return Promise.reject(new Error("Geen token"));
 var content=JSON.stringify(syncPayload());
 var build=function(id){return gh("PATCH","https://api.github.com/gists/"+id,{description:"weekmenu-sync",files:{"weekmenu.json":{content:content}}})};
 return resolveGist().then(function(g){
  if(!g){
   return gh("POST","https://api.github.com/gists",{description:"weekmenu-sync",public:false,files:{"weekmenu.json":{content:content}}})
    .then(function(g){S.sync.gistId=g.id;persist(true);syncOk("✅ Gist aangemaakt & geüpload ("+countMsg()+")");render()});
  }
  if(S.sync.gistId!==g.id)S.sync.gistId=g.id;
  persist(true);
  return build(g.id).then(function(){syncOk("✅ Geüpload naar GitHub ("+countMsg()+")");render()});
 });
}
function pullNow(){
 if(!S.sync||!S.sync.token)return Promise.reject(new Error("Geen token"));
 var grab=function(id){return gh("GET","https://api.github.com/gists/"+id)};
 return resolveGist().then(function(g){
  if(!g){setSyncStatus("Nog niets op GitHub gevonden. Wijzig eerst iets en druk op Sync.");render();return null}
  if(S.sync.gistId!==g.id)S.sync.gistId=g.id;
  persist(true);return doPull(grab(g.id));
 });
 function doPull(gp){
  return gp.then(function(g){
   var raw=g&&g.files&&g.files["weekmenu.json"]&&g.files["weekmenu.json"].content;
   if(!raw){setSyncStatus("Gist gevonden maar leeg; druk nogmaals op Sync om te uploaden.");return "empty"}
   var p;try{p=JSON.parse(raw)}catch(e){throw new Error("Ongeldige data")}
   S.sync.gistId=g.id;persist(true);
   if(!p.t||p.t>S.savedAt||!S.savedAt){applyPayload(p);S.savedAt=p.t||Date.now();persist(true);syncOk("⬇️ Data van GitHub opgehaald · weekmenu: "+S.menu.length+" recepten");render();return "pulled"}
   setSyncStatus("GitHub is niet nieuwer dan dit apparaat");return "same";
  });
 }
}
function forcePull(){
 if(!S.sync||!S.sync.token){alert("Vul eerst je GitHub-token in.");return}
 setSyncStatus("⏳ Forceren ophalen...");
 var after=function(g){
  var raw=g&&g.files&&g.files["weekmenu.json"]&&g.files["weekmenu.json"].content;
  if(!raw){setSyncStatus("Geen weekmenu-data op GitHub gevonden.");return}
  var p;try{p=JSON.parse(raw)}catch(e){setSyncStatus("❌ Ongeldige data op GitHub");return}
  if(g.id)S.sync.gistId=g.id;
  applyPayload(p);S.savedAt=p.t||Date.now();persist(true);
  syncOk("⬇️ Data geforceerd opgehaald · weekmenu: "+S.menu.length+" recepten");
  render();alert("✅ Opgehaald: "+S.menu.length+" weekmenu-recepten.")
 };
 resolveGist().then(function(g){if(!g)return null;if(S.sync.gistId!==g.id)S.sync.gistId=g.id;persist(true);return gh("GET","https://api.github.com/gists/"+g.id)})
 .then(after).catch(function(e){setSyncStatus("❌ "+e.message)});
}
function syncNow(){
 if(!S.sync||!S.sync.token){alert("Vul eerst je GitHub Personal Access Token in (rechten: gists).");return}
 setSyncStatus("⏳ Sync bezig...");
 pullNow().then(function(res){
  if(res==="same"||res==="empty"||res===null){return pushNow()}
 }).catch(function(e){setSyncStatus("❌ "+e.message)});
}
var PUSH_TIMER=null;
function schedulePush(){if(!S.sync||!S.sync.token)return;clearTimeout(PUSH_TIMER);PUSH_TIMER=setTimeout(function(){pushNow().catch(function(e){setSyncStatus("❌ Auto-upload mislukt: "+e.message)})},4000)}
function exportData(){
 var a=document.createElement("a");
 a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(syncPayload()));
 a.download="weekmenu-data.json";document.body.appendChild(a);a.click();a.remove();
}
function importData(inp){
 var f=inp.files&&inp.files[0];if(!f)return;
 var rd=new FileReader();
 rd.onload=function(){try{var p=JSON.parse(rd.result);if(!applyPayload(p)){alert("Dit bestand bevat geen herkenbare weekmenu-data.");return}S.savedAt=p.t||Date.now();persist(true);schedulePush();render();alert("✅ Data geïmporteerd (weekmenu: "+S.menu.length+" recepten).")}catch(e){alert("Ongeldig JSON-bestand.")}};
 rd.readAsText(f);
}

function stepsParse(t){
 var s=String(t||"").replace(/\r/g,"").trim();if(!s)return [];
 var lines=s.split(/\n+/).map(function(x){return x.trim()}).filter(function(l){return l&&!/^(bereidingswijze|bereiding|werkwijze|stappen|aanwijzingen|instructies|bereiding stap)\s*:?\s*$/i.test(l)});
 if(!lines.length)return [];
 var START=/^(?:stap\s*)?\d{1,2}\s*[.)\]:-]/i;
 var INLINENUM=/\s(?:stap\s*)?\d{1,2}\s*[.)\]:]/i;
 var stripNum=function(x){return x.replace(/^(?:stap\s*)?\d{1,2}\s*[.)\]:-]\s*/i,"").trim()};
 if(lines.length===1){
  var one=lines[0];
  if(INLINENUM.test(one.slice(1))){
   return one.replace(new RegExp("\\s(?=(?:stap\\s*)?\\d{1,2}\\s*[.)\\]:])","gi"),"\n").split(/\n+/).map(function(x){return stripNum(x)}).filter(Boolean);
  }
  return one.split(/\.\s+/).map(function(x){return x.trim().replace(/^[.\d]+[.)]?\s*/,"").trim().replace(/\.$/,"")+"."}).filter(Boolean);
 }
 var NUMONLY=/^(?:stap\s*)?\d{1,2}\s*[.)\]:-]?\s*$/i;
 if(lines.some(function(l){return START.test(l)||NUMONLY.test(l)})){
  var out=[];
  lines.forEach(function(l){
   if(START.test(l))out.push(stripNum(l));
   else if(NUMONLY.test(l))out.push("");
   else if(out.length)out[out.length-1]+=(out[out.length-1]?" ":"")+l;
   else out.push(l);
  });
  return out.filter(Boolean);
 }
 return lines;
}

  // koppel ingredient inputs

 }

 // score & sorteer

  .map(function(r){

  }).sort(function(a,b){
    var ca=(a.r.own||a.r.generated)?1:0,cb=(b.r.own||b.r.generated)?1:0;

  });

 list.forEach(function(x){

     "</div>"+(S.open[rid]?ingDetailHtml(r):"")+"</div>";
 });
 if(S.q&&!list.length)h+='<div class="card"><p class="muted">🔍 Niets gevonden voor "'+esc(S.q)+'". Probeer een ander woord, of voeg het als eigen recept toe.</p></div>';

 if(S.showExcluded&&S.excluded.length){

 }
 h+="</div>"; // sluit Recepten-card

 h+='<div class="card"><h2>⚙️ Sync &amp; data-overdracht</h2>'+

  '<div class="row" style="flex-wrap:wrap"><input class="flex" placeholder="GitHub token (plak hier; wordt alleen op dit apparaat bewaard)" value="'+esc(S.sync?S.sync.token||"":"")+'" oninput="S.sync=S.sync||{token:\'\',gistId:\'\'};S.sync.token=this.value.trim();persist(true)">'+

function renderShopping(){
 var h="";
 h+='<div class="card"><div class="row"><h2 style="margin:0">🏪 Boodschappen bij</h2><div class="row">'+
  STORES.map(function(s){return '<button class="btn '+(S.store===s?"":"ghost")+'" style="border-radius:99px;padding:6px 12px" onclick="setStore(\''+s+'\')">'+esc(s)+"</button>"}).join("")+
  "</div></div></div>";
 h+='<div class="card"><h2>➕ Los item toevoegen (lunch, ontbijt, etc.)</h2><div class="row">'+
  '<input class="flex" placeholder="Bijv. beleg, appels, havermout..." id="exName" oninput="var c=document.getElementById(\'exCat\');var g=guessCat(this.value);c.value=(this.value.trim()&&g&&g!==\'Overig\')?g:\'Overig\'"><select id="exCat">'+

  '<button class="btn" onclick="S.extraInput.name=document.getElementById(\'exName\').value;S.extraInput.cat=document.getElementById(\'exCat\').value;addExtra()">Toevoegen</button></div>'+

 var lines=shoppingList();
 if(lines.length===0&&S.removed.length===0&&S.extra.length===0)
  h+='<p class="muted">Nog geen lijst. Kies recepten in het weekmenu en de ingrediënten verschijnen hier.</p>';
 var byCat={};lines.forEach(function(l){(byCat[l.cat]=byCat[l.cat]||[]).push(l)});
 S.extra.forEach(function(it){var c=normCat(it.cat,it.name);(byCat[c]=byCat[c]||[]).push({item:it.name,cat:c,extra:true,xid:it.id,src:[],port:2})});
 CATS.concat(Object.keys(byCat).filter(function(c){return CATS.indexOf(c)<0})).forEach(function(cat){
  if(!byCat[cat])return;
  h+='<div class="card"><h3>'+esc(cat)+"</h3><ul>";
  byCat[cat].forEach(function(l){
   var k=l.extra?("extra:"+l.xid):l.item;
   h+='<li class="line"><input type="checkbox" '+(S.checked[k]?"checked":"")+' onchange="toggleCheck(\''+esc(k)+'\')">'+
      '<span class="'+(S.checked[k]?"done":"")+'">'+(l.extra?"":(qtyLabel(l.item,l.port,l.cust)?'<b>'+esc(qtyLabel(l.item,l.port,l.cust))+'</b> ':''))+esc(l.item)+"</span>"+
      (l.extra?'<span class="muted">los item</span>':'<span class="muted">'+l.src.map(function(s){return esc(s)}).join(", ")+"</span>")+
      (l.port>2?chip('± '+(l.port/2)+'× inkopen (visite)','amber'):"")+
      (l.cat==="Diepvries"?(l.fridgeOk?chip("❄️ koelkast bewaren, prima","amber"):chip("⚠ geen vriezer: alleen op de dag zelf","red")):"")+
      (l.extra?'<button class="x" style="margin-left:auto" onclick="delExtra('+l.xid+')">verwijder</button>':'<button class="x" style="margin-left:auto" onclick="haveAtHome(\''+esc(l.item)+'\',\''+esc(l.cat)+'\')">heb ik al ✕</button>')+'</li>';
  });
  h+="</ul></div>";
 });
 if(S.removed.length){
  h+='<div class="warn">';
  S.removed.forEach(function(r){
   h+='<div>✗ '+esc(r.name)+' staat niet op de lijst (staat bij "In huis"). <button class="btn ghost" style="padding:2px 8px" onclick="unRemove(\''+esc(r.name)+'\')">zet terug</button></div>';
  });
  h+="</div>";
 }
 return h;
}

function renderStock(){
 var h=""; 
 h+='<div class="card"><h2>🧺 Wat ik nog over heb</h2><p class="hint">Dit gaat voor: recepten die hiervan gebruikmaken staan bovenaan, en het wordt automatisch van je boodschappenlijst afgehaald.</p>'+
    '<div class="row"><input class="flex" id="stName" placeholder="Bijv. halve pak spinazie, 3 aardappelen..."><button class="btn" onclick="S.stockInput.name=document.getElementById(\'stName\').value;addStock()">Toevoegen</button></div>';
 if(S.stock.length){
  var byCat={};
  S.stock.forEach(function(s){var c=normCat(guessCat(s.name));(byCat[c]=byCat[c]||[]).push(s)});
  CATS.concat(Object.keys(byCat).filter(function(c){return CATS.indexOf(c)<0})).forEach(function(cat){
   if(!byCat[cat])return;
   h+='<div style="margin-top:12px"><h3 style="margin:0 0 6px;font-size:14px">'+esc(cat)+'</h3><div class="row" style="flex-wrap:wrap">';
   byCat[cat].forEach(function(s){
    h+='<span class="chip green">'+esc(s.name)+' <button class="x" style="display:inline;color:#065f46" onclick="delStock('+s.id+')">✕</button></span>';
   });
   h+="</div></div>";
  });
 } else h+='<p class="muted" style="margin-top:10px">Nog niets aangegeven.</p>';
 h+="</div>";

 var list=allRecipes().map(function(r){
   var hits=0;r.ingredients.forEach(function(ing){if(stockMatches(ing[0]))hits++});
   var rat=S.ratings[r.rid||r.name]||{};

 }).sort(function(a,b){return b.hits-a.hits}).slice(0,6);

 h+='<div class="card"><h2>💡 Tip: maak dit met je restjes</h2><ul>';
 list.forEach(function(x){

 });
 h+='</ul><p class="hint" style="margin-top:8px">Recepten die je eerder hoger beoordeelde, komen hier vaker in te staan.</p></div>';
 return h;
}
